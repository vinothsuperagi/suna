services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      - ENV_MODE=local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3030:3000"
    volumes:
      - ./frontend/.env.local:/app/.env.local:ro
    environment:
      - NEXT_PUBLIC_BACKEND_URL="http://localhost:8000/api"
      - NODE_ENV=production
    command: ["npm", "run", "start"]
    depends_on:
      - backend